[package]
name = "horo-ui"
version = "0.1.0"
edition = "2024"
description = "Leptos rewrite of horo-ui (natal & sky charts)"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
gloo-net = { version = "0.7", features = ["http"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
console_log = "1.1"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["console", "Window", "Storage"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
stylance = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[package.metadata.stylance]
# 各组件 *.module.css 经 stylance 加哈希后打包成这一个文件，由 index.html 引入
output_file = "./styles/stylance.css"
folders = ["./src/"]
extensions = [".module.css"]

worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_vary on;

    # 静态资源已在构建阶段预压缩为 .gz，由 nginx 直接下发，不做实时压缩
    # 运行时 gzip 仅作兜底（如日后新增未预压缩的可压缩文件）
    gzip_static on;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # SPA 回退：未命中静态资源时返回 index.html（客户端路由用）
        # /api 等其余路由一律交给 ingress 转发，本镜像不做任何反向代理
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
